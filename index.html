<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ticket Raising System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .card {
            border-radius: 15px;
        }
        footer {
            margin-top: auto;
        }
    </style>
</head>
<body>

<!-- Main Card -->
<div class="container d-flex justify-content-center align-items-center mt-5">
    <div class="card shadow-lg p-4 text-center" style="width: 420px;">
        <h2 class="mb-3">🎫 Ticket Raising System</h2>
        <p class="text-muted">Create, track, and manage your support tickets</p>

        <hr>

        <a href="/register" class="btn btn-primary w-100 mb-2">User Register</a>
        <a href="/login" class="btn btn-success w-100 mb-2">User Login</a>
        <a href="/admin/login" class="btn btn-warning w-100">Admin Login</a>
    </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">Made by <strong>Pooja Joshi</strong> ❤️</p>
</footer>

</body>
</html>
